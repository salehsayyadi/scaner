name: Publish appearance-only web preview

on:
  push:
    branches: [main]
    paths:
      - 'web-preview/**'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enable Settings > Pages > Source > GitHub Actions once, as repository owner.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-preview
      - name: Deploy appearance-only preview
        id: deployment
        uses: actions/deploy-pages@v4
